version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: infra/Dockerfile.backend
    container_name: crag_study_backend
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
      - chromadb_data:/app/chroma_db
    env_file:
      - .env
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: infra/Dockerfile.frontend
    container_name: crag_study_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      # Ignore node_modules from host to use container's node_modules
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chromadb_data: